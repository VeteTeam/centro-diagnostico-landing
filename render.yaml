services:
  - type: web
    name: centro-diagnostico-landing
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_VERCEL_ANALYTICS_ID
        generateValue: true
    healthCheckPath: /
    autoDeploy: true

